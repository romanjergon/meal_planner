[tool.pytest.ini_options]
addopts = "--cov=meal_planner"
testpaths = [
    "tests",
]


[tool.mypy]
mypy_path = "src"
ignore_missing_imports_per_module = true
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_reexport = true

[tool.isort]
profile = "black"

[tool.poetry.group.dev.dependencies]
tox = "^4.32.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
mypy = "^1.15.0"
black = "^24.0.0"
flake8 = "^7.0.0"
setuptools = "^80.0.0"
pytest-mock = "^3.15.0"
mock = "^5.0.0"
bandit = "^1.8.0"
safety = "^3.7.0"
hypothesis = "^6.130.0"
isort = "^5.13.0"

[flake8]
max-line-length = 88
extend-ignore = "E203, E501"

[tool.bandit]
skips = ["B311"]
[project]
name = "meal-planner"
version = "0.1.0"
description = "Creates meal plan of main lunch courses because family needs to have one home cooked meal a day. By default the meal plan is generated for the next week. Meal plan is based on google sheet"
authors = [
    {name = "Roman Jergon"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.0,<2.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "pygsheets (>=2.0.6,<3.0.0)",
    "python-dateutil (>=2.9.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
