[tox]
minversion = 4.0.0
envlist = py313, py312, mypy, black, flake8, isort, bandit, safety
isolated_build = true

[gh-actions]
python =
    3.13: py313, mypy, black, flake8, isort, bandit, safety
    3.12: py312



[testenv]
setenv =
    PYTHONPATH = {toxinidir}
passenv =
    GOOGLE_CREDENTIALS
    MAIL_PASSWORD
    MEALS_SHEET
    NOTIFICATION_MAILBOX
    PERSONAL_MAILBOX

allowlist_externals = poetry
skip_install = true
commands_pre =
    poetry install --with dev --sync
commands =
    poetry run pytest --basetemp={envtmpdir} tests

[testenv:bandit]
basepython = python3.13
allowlist_externals = poetry
skip_install = true
commands_pre =
    poetry install --only dev --no-root
commands =
    poetry run bandit -r src -c bandit.yaml

[testenv:black]
basepython = python3.13
allowlist_externals = poetry
skip_install = true
commands_pre =
    poetry install --only dev --no-root
commands =
    poetry run black src tests

[testenv:flake8]
basepython = python3.13
allowlist_externals = poetry
skip_install = true
commands_pre =
    poetry install --only dev --no-root
commands =
    poetry run flake8 src tests

[testenv:isort]
basepython = python3.13
allowlist_externals = poetry
skip_install = true
commands_pre =
    poetry install --only dev --no-root
commands =
    poetry run isort src tests

[testenv:mypy]
basepython = python3.13
allowlist_externals = poetry
skip_install = true
commands_pre =
    poetry install --with dev --sync
commands =
    poetry run mypy --install-types --non-interactive src

[testenv:safety]
basepython = python3.13
allowlist_externals = poetry
skip_install = true
commands_pre =
    poetry install --only dev --no-root
commands =
    poetry run safety check
